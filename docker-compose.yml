services:
  backend:
    build:
      context: ./backend
    image: hexy-backend:latest
    container_name: hexy-backend
    environment:
      RL_ROOT: /vendor_rl
      CAVE_ROOT: /cave_assets
      CORS_ORIGINS: "*"
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      # GPU configuration removed for macOS compatibility
      # NVIDIA_VISIBLE_DEVICES: all
      # NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      GDINO_DEVICE: cpu  # Force CPU for macOS
      GDINO_PROMPT_DEFAULT: person
      GDINO_CAMERA_DEFAULT: robot_pov
      GDINO_BOX_THRESHOLD: "0.35"
      GDINO_TEXT_THRESHOLD: "0.25"
      GDINO_WEIGHTS_PATH: /models/groundingdino/groundingdino_swint_ogc.pth
      HF_TOKEN: ${HF_TOKEN:-}
      WHISPER_MODEL: base
      WHISPER_DEVICE: cpu  # Force CPU for macOS
      WHISPER_EMIT_PROB: "0.75"
      WHISPER_MIN_INTERVAL_SEC: "2.0"
      WHISPER_MAX_INTERVAL_SEC: "6.0"
      WHISPER_MIN_DISTANCE_M: "2.0"
      WHISPER_MAX_DISTANCE_M: "18.0"
      WHISPER_DISTANCE_REF_M: "2.0"
      WHISPER_DISTANCE_ROLLOFF: "1.0"
      WHISPER_AUDIO_RMS_THRESHOLD: "0.03"
      WHISPER_AUDIO_RMS_MAX: "0.7"
    volumes:
      - ./learning:/vendor_rl:ro
      - ./cave-gen/cave_env:/cave_assets:ro
      - ./modelSetUp/groundingDino/weights:/models/groundingdino:ro
    ports:
      - "${HEXY_API_PORT:-8000}:8000"
    # GPU configuration removed for macOS compatibility
    # gpus: all
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_HEXY_BE_URL: ""
    image: hexy-frontend:latest
    container_name: hexy-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HEXY_WEB_PORT:-8080}:80"
    restart: unless-stopped

  learning:
    build:
      context: ./learning
      args:
        JAX_ACCELERATOR: cpu
    image: hexy-learning:cpu
    profiles: ["training"]
    working_dir: /workspace
    volumes:
      - ./learning:/workspace
    environment:
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    tty: true
    stdin_open: true
    command: bash

  learning-gpu:
    build:
      context: ./learning
      args:
        JAX_ACCELERATOR: cuda12
    image: hexy-learning:cuda12
    profiles: ["training-gpu"]
    working_dir: /workspace
    volumes:
      - ./learning:/workspace
    environment:
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    gpus: all
    tty: true
    stdin_open: true
    command: bash

  cave-gen:
    build:
      context: ./cave-gen
    image: hexy-cave-gen:latest
    profiles: ["data-gen"]
    environment:
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      CAVE_OUTPUT_DIR: /cave_env
      CAVE_MESH_DIR: /cave_env/meshes
      CAVE_DATASET_DIR: /dataset
      HEXAPOD_MODEL_PATH: /vendor_rl/models/hexapod_static.xml
    volumes:
      - ./cave-gen/cave_env:/cave_env
      - ./learning:/vendor_rl:ro
      - ./learning:/rl:ro
      - cave_dataset:/dataset
    tty: true

volumes:
  cave_dataset:
