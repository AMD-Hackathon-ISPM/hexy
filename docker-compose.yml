services:
  backend:
    build:
      context: ./backend
      args:
        LLAMA_CPP_CUDA_ARCH: ${LLAMA_CPP_CUDA_ARCH:-all-major}
    image: hexy-backend:latest
    container_name: hexy-backend
    environment:
      RL_ROOT: /vendor_rl
      CAVE_ROOT: /cave_assets
      CORS_ORIGINS: "*"
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      TORCH_ACCELERATOR: cuda
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      GDINO_DEVICE: cuda
      GDINO_PROMPT_DEFAULT: person . human . survivor . human silhouette
      GDINO_CAMERA_DEFAULT: robot_pov
      GDINO_BOX_THRESHOLD: "0.12"
      GDINO_TEXT_THRESHOLD: "0.12"
      GDINO_WHITE_MIN_CHANNEL: "155"
      GDINO_WHITE_MAX_SPREAD: "85"
      GDINO_WHITE_MIN_RATIO: "0.015"
      GDINO_DEBUG_DIR: "/tmp/dino_debug"
      GDINO_LOCAL_DIR: /modelSetUp/groundingDino/weights
      GDINO_HF_SUBFOLDER: ""
      GDINO_HF_MODEL: LeBabyOx/dino-cave-survivor
      QWEN25VL_MODEL_ID: Qwen/Qwen2.5-VL-2B-Instruct
      QWEN25VL_LOCAL_DIR: /modelSetUp/qwen25vl
      QWEN25VL_DEVICE: cuda
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_HUB_TOKEN: ${HF_TOKEN:-}
      WHISPER_MODEL: base
      WHISPER_DEVICE: cuda
      WHISPER_EMIT_PROB: "0.75"
      WHISPER_MIN_INTERVAL_SEC: "2.0"
      WHISPER_MAX_INTERVAL_SEC: "6.0"
      WHISPER_MIN_DISTANCE_M: "2.0"
      WHISPER_MAX_DISTANCE_M: "18.0"
      WHISPER_DISTANCE_REF_M: "2.0"
      WHISPER_DISTANCE_ROLLOFF: "1.0"
      WHISPER_AUDIO_RMS_THRESHOLD: "0.03"
      WHISPER_AUDIO_RMS_MAX: "0.7"
    volumes:
      - ./learning:/vendor_rl:ro
      - ./cave-gen/cave_env:/cave_assets:ro
      - ./modelSetUp:/modelSetUp
      - hf_cache:/root/.cache/huggingface
    ports:
      - "${HEXY_API_PORT:-8000}:8000"
    gpus: all
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_HEXY_BE_URL: "http://localhost:8000"
    image: hexy-frontend:latest
    container_name: hexy-frontend
    depends_on:
      - backend
    ports:
      - "${HEXY_WEB_PORT:-8080}:80"
    restart: unless-stopped

  learning:
    build:
      context: ./learning
      args:
        JAX_ACCELERATOR: cpu
    image: hexy-learning:cpu
    profiles: ["training"]
    working_dir: /workspace
    volumes:
      - ./learning:/workspace
    environment:
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    tty: true
    stdin_open: true
    command: bash

  learning-gpu:
    build:
      context: ./learning
      args:
        JAX_ACCELERATOR: cuda12
    image: hexy-learning:cuda12
    profiles: ["training-gpu"]
    working_dir: /workspace
    volumes:
      - ./learning:/workspace
    environment:
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    gpus: all
    tty: true
    stdin_open: true
    command: bash

  cave-gen:
    build:
      context: ./cave-gen
    image: hexy-cave-gen:latest
    profiles: ["data-gen"]
    environment:
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      CAVE_OUTPUT_DIR: /cave_env
      CAVE_MESH_DIR: /cave_env/meshes
      CAVE_DATASET_DIR: /dataset
      CAVE_GENERATE_DATASET: ${CAVE_GENERATE_DATASET:-0}
      HEXAPOD_MODEL_PATH: /vendor_rl/models/hexapod_static.xml
    volumes:
      - ./cave-gen/cave_env:/cave_env
      - ./learning:/vendor_rl:ro
      - ./learning:/rl:ro
      - cave_dataset:/dataset
    tty: true

volumes:
  cave_dataset:
  hf_cache:
