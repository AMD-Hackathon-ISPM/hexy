services:
  backend:
    build:
      context: ./backend
    image: hexy-backend:latest
    container_name: hexy-backend
    environment:
      RL_ROOT: /vendor_rl
      MODEL_PATH: /vendor_rl/models/hexapod_static.xml
      CORS_ORIGINS: "*"
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
    volumes:
      - ./learning:/vendor_rl:ro
    ports:
      - "${HEXY_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_HEXY_BE_URL: ""
    image: hexy-frontend:latest
    container_name: hexy-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HEXY_WEB_PORT:-8080}:80"
    restart: unless-stopped

  learning:
    build:
      context: ./learning
      args:
        JAX_ACCELERATOR: cpu
    image: hexy-learning:cpu
    profiles: ["training"]
    working_dir: /workspace
    volumes:
      - ./learning:/workspace
    environment:
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    tty: true
    stdin_open: true
    command: bash

  learning-gpu:
    build:
      context: ./learning
      args:
        JAX_ACCELERATOR: cuda12
    image: hexy-learning:cuda12
    profiles: ["training-gpu"]
    working_dir: /workspace
    volumes:
      - ./learning:/workspace
    environment:
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    gpus: all
    tty: true
    stdin_open: true
    command: bash
