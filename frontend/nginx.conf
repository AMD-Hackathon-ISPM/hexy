map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WebSocket: /mujoco/stream — must match BEFORE the generic /mujoco/ block
    location = /mujoco/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    location /mujoco/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /assets/rl/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Optional, for future Cave-Gen import. Backend currently 404s if CAVE_ROOT is unset.
    location /assets/cave/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
